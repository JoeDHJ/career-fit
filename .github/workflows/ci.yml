name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      atlas_ref:
        description: "AI Labor Atlas branch, tag, or commit to use for integration verification"
        required: false
        default: main

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" -c constraints-ci.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests tools
      - run: python -m ruff check .

  browser:
    runs-on: ubuntu-24.04
    env:
      AI_LABOR_ATLAS_DATA_DIR: ${{ github.workspace }}/ai-labor-atlas/data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: JoeDHJ/ai-labor-atlas
          ref: ${{ inputs.atlas_ref || ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/mobile-alias-validation' || github.ref_name == 'codex/mobile-alias-validation') && 'codex/alias-release-validation') || 'main' }}
          path: ai-labor-atlas
          token: ${{ github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install both projects
        run: |
          python -m pip install -e ./ai-labor-atlas -c ./ai-labor-atlas/constraints-ci.txt
          python -m pip install -e . -c constraints-ci.txt
      - name: Install Chromium for Playwright CLI
        run: npx --yes playwright install --with-deps chromium
      - name: Build Atlas demo release
        working-directory: ai-labor-atlas
        run: python -m ai_labor_atlas.cli build --demo
      - name: Run 390px browser regression
        shell: bash
        run: |
          set -euo pipefail
          atlas_pid=""
          career_pid=""
          cleanup() {
            if [[ -n "$career_pid" ]]; then kill "$career_pid" 2>/dev/null || true; fi
            if [[ -n "$atlas_pid" ]]; then kill "$atlas_pid" 2>/dev/null || true; fi
            if [[ -n "$career_pid" ]]; then wait "$career_pid" 2>/dev/null || true; fi
            if [[ -n "$atlas_pid" ]]; then wait "$atlas_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          python -m ai_labor_atlas.cli serve > "$RUNNER_TEMP/atlas-browser.log" 2>&1 &
          atlas_pid=$!
          CAREER_FIT_ATLAS_URL=http://127.0.0.1:8765 python -m skillbundle.cli serve > "$RUNNER_TEMP/career-fit-browser.log" 2>&1 &
          career_pid=$!
          for url in http://127.0.0.1:8765/ http://127.0.0.1:8766/; do
            ready=""
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url" > /dev/null; then ready="yes"; break; fi
              sleep 1
            done
            if [[ "$ready" != "yes" ]]; then
              cat "$RUNNER_TEMP/atlas-browser.log" || true
              cat "$RUNNER_TEMP/career-fit-browser.log" || true
              exit 1
            fi
          done
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/verify_mobile_layout.ps1

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -c constraints-ci.txt
      - run: python tools/audit_500_jobseeker_scenarios.py

  release-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Run documented commands outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          career-fit analyze \
            --job-file "$GITHUB_WORKSPACE/examples/single_job/people_analytics_job.txt" \
            --candidate-file "$GITHUB_WORKSPACE/examples/single_job/candidate_profile.txt" \
            --evidence-file "$GITHUB_WORKSPACE/examples/single_job/evidence.json" \
            --review-file "$GITHUB_WORKSPACE/examples/single_job/role_review.json" \
            > career-fit-report.json
          career-fit taxonomy > career-fit-taxonomy.json
          career-fit compare \
            --roles-file "$GITHUB_WORKSPACE/examples/role_portfolio.json" \
            --candidate-file "$GITHUB_WORKSPACE/examples/single_job/candidate_profile.txt" \
            --evidence-file "$GITHUB_WORKSPACE/examples/single_job/evidence.json" \
            --review-file "$GITHUB_WORKSPACE/examples/single_job/candidate_evidence_review.json" \
            > career-fit-comparison.json
          python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          import career_fit
          import skillbundle

          report = json.loads(Path("career-fit-report.json").read_text())
          assert version("career-fit") == career_fit.__version__ == "0.6.0"
          assert skillbundle.__version__ == "0.6.0"
          assert report["schema_version"] == "career_fit.v0.5"
          assert report["review"]["status"] == "user_confirmed"
          assert report["summary"]["analysis_status"] == "scored"
          assert report["summary"]["evidence_fit_score"] is not None
          taxonomy = json.loads(Path("career-fit-taxonomy.json").read_text())
          assert len(taxonomy["categories"]) == 10
          comparison = json.loads(Path("career-fit-comparison.json").read_text())
          assert comparison["schema_version"] == "career_fit.compare.v0.4"
          assert comparison["comparison_status"] == "role_review_required"
          assert all(role["priority_rank"] is None for role in comparison["roles"])
          assert len(comparison["roles"]) in {2, 3}
          PY
      - name: Rebuild and run from the source distribution
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/career-fit" taxonomy > career-fit-sdist-taxonomy.json
          "$RUNNER_TEMP/sdist-env/bin/career-fit" analyze \
            --job-file "$GITHUB_WORKSPACE/examples/single_job/people_analytics_job.txt" \
            --candidate-file "$GITHUB_WORKSPACE/examples/single_job/candidate_profile.txt" \
            --evidence-file "$GITHUB_WORKSPACE/examples/single_job/evidence.json" \
            --review-file "$GITHUB_WORKSPACE/examples/single_job/role_review.json" \
            > career-fit-sdist-report.json
