[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-fit"
version = "0.6.0"
description = "Explainable job-fit, skill-gap, and career-pathway analysis built on transparent skill evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Career Fit contributors"}]
dependencies = [
  "pypdf==6.10.0",
  "reportlab==4.4.9",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/JoeDHJ/career-fit"
Repository = "https://github.com/JoeDHJ/career-fit"
Issues = "https://github.com/JoeDHJ/career-fit/issues"

[project.optional-dependencies]
ml = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[project.scripts]
career-fit = "career_fit.cli:main"
skillbundle = "skillbundle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skillbundle.resources" = ["*.json", "*.ttf"]
