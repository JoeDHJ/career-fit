[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-fit"
version = "0.1.0"
description = "Explainable job-fit, skill-gap, and career-pathway analysis built on transparent skill evidence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Career Fit contributors"}]
dependencies = []

[project.optional-dependencies]
ml = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
career-fit = "career_fit.cli:main"
skillbundle = "skillbundle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
