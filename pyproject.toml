[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbundle"
version = "0.1.0"
description = "Explainable skill extraction, normalization, taxonomy mapping, and skill-bundle measurement."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SkillBundle contributors"}]
dependencies = []

[project.optional-dependencies]
ml = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
skillbundle = "skillbundle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

